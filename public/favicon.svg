<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="civic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#0F172A" />
  <!-- Connecting Links -->
  <line x1="24" y1="13" x2="13" y2="33" stroke="url(#civic-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="24" y1="13" x2="35" y2="33" stroke="url(#civic-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="13" y1="33" x2="35" y2="33" stroke="url(#civic-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="24" y1="13" x2="24" y2="26" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <!-- Center Core Node -->
  <circle cx="24" cy="26" r="4" fill="#38BDF8" filter="url(#glow)" />
  <!-- Vertex Nodes -->
  <circle cx="24" cy="13" r="5" fill="url(#civic-grad)" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="13" cy="33" r="5" fill="url(#civic-grad)" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="35" cy="33" r="5" fill="url(#civic-grad)" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
